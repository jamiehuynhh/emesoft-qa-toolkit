# =============================================================================
#  Deploy the toolkit to GitHub Pages
#  -----------------------------------------------------------------------------
#  Runs the test suite first and refuses to publish if it fails, so a broken
#  build never reaches the people using it.
#
#  One-time setup in the repository: Settings -> Pages -> Build and deployment
#  -> Source: "GitHub Actions".
#
#  Note: only the 20 offline tools need this. The AI tools have no server here,
#  so they fall back to "Copy prompt" or to a key entered in the browser.
# =============================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you re-deploy from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; keep the newest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No dependencies to install - the project has none.
      - name: Run the self test
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          # everything the browser needs, and nothing else
          cp index.html _site/
          cp -r assets js _site/
          [ -f _headers ] && cp _headers _site/
          # Jekyll would otherwise skip files starting with an underscore
          touch _site/.nojekyll

          # Server code and secrets must never be published. Written as plain
          # ifs on purpose: `test ... || ( ... exit 1 )` only exits the subshell,
          # so that form would report a leak and still deploy it.
          for forbidden in server scripts .env .env.local logs; do
            if [ -e "_site/$forbidden" ]; then
              echo "::error::$forbidden leaked into the published bundle"
              exit 1
            fi
          done

          echo "Bundle contents:"
          find _site -type f | sort
          echo "Bundle size: $(du -sh _site | cut -f1)"

      - name: Check every asset the page references is present
        shell: bash
        run: |
          set -euo pipefail
          # A missing file here is a blank page for every visitor, so this must
          # actually fail. The names are collected on stdout rather than into a
          # variable inside the loop: a `while` on the right of a pipe runs in a
          # subshell, so a flag set in there is lost and the check always passed.
          missing=$(
            {
              grep -o 'src="[^"]*"' index.html | sed 's/src="//;s/"//' | grep -v '^http'
              grep -o 'href="[^"]*\.css"' index.html | sed 's/href="//;s/"//'
            } | while read -r f; do
              [ -f "_site/$f" ] || echo "$f"
            done
          )
          if [ -n "$missing" ]; then
            echo "::error::assets referenced by index.html but missing from the bundle:"
            echo "$missing"
            exit 1
          fi
          echo "All $(grep -c 'src="js' index.html) referenced assets are present."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
