# =============================================================================
#  Deploy the toolkit to GitHub Pages
#  -----------------------------------------------------------------------------
#  Runs the test suite first and refuses to publish if it fails, so a broken
#  build never reaches the people using it.
#
#  One-time setup in the repository: Settings -> Pages -> Build and deployment
#  -> Source: "GitHub Actions".
#
#  Note: only the 20 offline tools need this. The AI tools have no server here,
#  so they fall back to "Copy prompt" or to a key entered in the browser.
# =============================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you re-deploy from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; keep the newest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No dependencies to install - the project has none.
      - name: Run the self test
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Assemble and verify the static bundle
        # The same script as `npm run build` locally, so CI cannot pass on a
        # bundle that would fail on your machine. It fails the run if server
        # code or a secret leaked in, or if the page references a file that is
        # not in the bundle -- fonts inside CSS url() and the logo names that
        # js/core.js builds by concatenation included.
        run: npm run build -- --out _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
